<?xml version="1.0" encoding="UTF-8"?>
<!-- VELOS logo — professional 3-segment Veles symbol on copper gradient tile.
     Faithful to Wikipedia Symbol_of_Veles.svg with depth effects. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <defs>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="65%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect width="100" height="110" rx="15" fill="url(#copper)"/>
  <rect width="100" height="110" rx="15" fill="url(#sheen)"/>
  <rect width="100" height="110" rx="15" fill="url(#shadow)"/>
  <!-- 3 Veles segments in cream -->
  <path d="M10 8 L90 8 L83 23 L17 23 Z" fill="#FFFBF5"/>
  <path d="M12 28 L50 98 L88 28 Z" fill="#FFFBF5"/>
  <path d="M28 33 L50 68 L72 33 Z" fill="#FFFBF5"/>
</svg>
