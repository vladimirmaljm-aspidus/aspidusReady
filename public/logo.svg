<?xml version="1.0" encoding="UTF-8"?>
<!-- VELOS logo — Veles symbol (inverted A) on copper/amber gradient tile.
     Veles: Slavic god of earth, waters, and wealth. Symbol source:
     https://en.wikipedia.org/wiki/Veles_(god)#/media/File:Symbol_of_Veles.svg -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="velos-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="55%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="velos-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded copper tile -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" ry="8" fill="url(#velos-grad)" stroke="#78350F" stroke-width="0.5"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" ry="8" fill="url(#velos-sheen)"/>
  <!-- Veles symbol (inverted A): downward triangle with crossbar -->
  <g fill="none" stroke="#FFFBF5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 8 L16 26.5"/>
    <path d="M24.5 8 L16 26.5"/>
    <path d="M10.3 14.5 L21.7 14.5"/>
  </g>
</svg>
