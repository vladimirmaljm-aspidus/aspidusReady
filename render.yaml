services:
  - type: web
    name: velos-trade-platform
    runtime: node
    plan: starter
    buildCommand: NODE_OPTIONS="--max-old-space-size=2048" npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: HOSTNAME=0.0.0.0 NODE_ENV=production node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_BACKEND
        value: supabase
      - key: HOSTNAME
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
        # IMPORTANT: Must be https://xxxxx.supabase.co (NOT postgresql://)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # ─── P0-3 / Feature 1 — vault key separation ─────────────────────────────
      # JWT_SECRET_KEY: signs / verifies session JWTs (src/lib/auth/session.ts).
      # Falls back to SECRET_KEY when unset — provision a DIFFERENT random
      # value so a JWT-key compromise cannot decrypt the vault (and vice
      # versa). Generate with: openssl rand -hex 32
      - key: JWT_SECRET_KEY
        sync: false
      # VAULT_KEY_V2: AES-256-GCM key for vault secrets
      # (src/lib/api/vault-crypto.ts). Falls back to SECRET_KEY when unset.
      # Provision a DIFFERENT random value (min 16 chars) so the vault is
      # decoupled from JWT signing.
      - key: VAULT_KEY_V2
        sync: false
      # FIELD_ENCRYPTION_KEY: AES-256-GCM key for per-field PII
      # (partners.contact_email / phone / tax_id, portal_access.portal_email,
      # settings.comms.smtp_password — see src/lib/crypto/field-encryption.ts).
      # Falls back to SECRET_KEY when unset. Provision a DIFFERENT random
      # value so a field-key compromise does NOT auto-compromise the vault.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # ─── P0-3 / Feature 4 — breach notification ──────────────────────────────
      # DPA / DPO contact emails for GDPR Art. 33(1) supervisory-authority
      # breach notifications. The hourly cron
      # (/api/cron/breach-notification-check) escalates incidents whose
      # 72-hour deadline is approaching or breached; the notify endpoint
      # (/api/admin/incidents/[id]/notify) dispatches the email.
      - key: BREACH_NOTIFICATION_DPA_EMAIL
        sync: false
      - key: BREACH_NOTIFICATION_DPO_EMAIL
        sync: false
      - key: BREACH_NOTIFICATION_WEBHOOK_URL
        sync: false
      # ⚠️  REQUIRED: ADMIN_USERNAME, ADMIN_PASSWORD and ADMIN_EMAIL MUST be set manually
      #     before running POST /api/setup to create the first admin user.
      #     Do NOT deploy without setting these to secure custom values.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # ⚠️  CRITICAL: APP_BASE_URL must point to this service's public URL.
      #     Email links (welcome, password reset, KYC notifications) will be
      #     broken if this is missing or points to localhost.
      - key: APP_BASE_URL
        sync: false
      # ─── F-8 (Infra P1) ────────────────────────────────────────────────────
      # CRON_TOKEN: shared secret used to authenticate pg_cron → API calls
      # (webhook-retry, subscription-sweep, invoice-overdue). Sent via the
      # `Authorization: Bearer <token>` header (NOT URL query — keeps the
      # token out of nginx access logs and pg_cron.job.command history).
      # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: CRON_TOKEN
        sync: false
      # NOREPLY_EMAIL: From: address for outbound transactional email
      # (welcome, password reset, KYC notifications). Falls back to a
      # noreply@<APP_BASE_URL domain> derivation if not set.
      - key: NOREPLY_EMAIL
        sync: false
      # ─── Sentry (F-8) — error monitoring ──────────────────────────────────
      # Optional: set both DSNs to the same project DSN. When unset, the
      # Sentry SDK no-ops at runtime (no events sent, no overhead).
      # NEXT_PUBLIC_SENTRY_DSN is exposed to the browser bundle; SENTRY_DSN
      # is server-only. Both are safe to leave empty.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # SENTRY_AUTH_TOKEN: only needed if you want source-map uploads during
      # build. Without it, source-map upload silently skips (no error).
      - key: SENTRY_AUTH_TOKEN
        sync: false
